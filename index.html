  const ctx = canvas.getContext('2d')!;
  const wrap = canvas.parentElement!;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    for (let i = 0; i < dots; i++) for (let j = 0; j < dots; j++) {
      ctx.fillRect(Math.round(x + (i + .5) * slot + (slot - dot) / 2), Math.round(y + (j + .5) * slot + (slot - dot) / 2), dot, dot);

    const span = cell * cells;
    const progress = slide ? 1 - (1 - Math.min(1, (time - slide.start) / timing.slide)) ** 3 : 0;

    ctx.fillRect(0, 0, span, span);
    ctx.fillStyle = colors.dot;

      const [dx, dy] = slide!.axis === 'row' ? [offset, 0] : [0, offset];

      const [wx, wy] = slide!.axis === 'row' ? [-slide!.dir * span, 0] : [0, -slide!.dir * span];

      square(x * cell + dx + wx, y * cell + dy + wy);

  };

  const drawCode = (elapsed: number) => {
    const span = cell * cells;
    const size = Math.max(Math.round(8 * dpr), Math.round(slot * 1.3));
    const lineHeight = Math.round(size * 1.25);
    const scroll = elapsed * .09; // lines per millisecond
    ctx.fillStyle = colors.ground;
    ctx.fillRect(0, 0, span, span);
    ctx.fillStyle = colors.code;
    ctx.font = `${size}px ui-monospace, Menlo, monospace`;
    ctx.textBaseline = 'top';
    const first = codeLine + Math.floor(scroll);
    const top = -(scroll % 1) * lineHeight;
    for (let row = 0; row <= Math.ceil(span / lineHeight); row++) {
      ctx.fillText(source[(first + row) % source.length], slot, top + row * lineHeight);
    }
  };

  const draw = (time: number) => {
    if (phase === 'pattern') drawPattern(time);
    else if (phase === 'code') drawCode(time - phaseStart);
    else {
      ctx.fillStyle = colors.dot;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  };

  const frame = (time: number) => {
    advance(time);
    draw(time);
    window.requestAnimationFrame(frame);
  };

  new ResizeObserver(() => { resize(); if (reducedMotion) draw(0); }).observe(wrap);
  resize();
  if (reducedMotion) draw(0);
  else window.requestAnimationFrame(frame);
}
